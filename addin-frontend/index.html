<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant IA Excel - Afrique Francophone</title>
    <!-- Script officiel Office.js Microsoft -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script>
      // Initialisation synchrone immédiate d'Office.js requise par Excel 2016-365
      window.Office = window.Office || {};
      window.Office.initialize = function (reason) {
        console.log("[Office.initialize] Prêt, contexte hôte initialisé :", reason);
        window.__officeReady = true;
      };

      // Service Worker actif pour résilience et ouverture instantanée sur connexion lente / hors-ligne
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            console.log('[SW] Enregistré pour assurer l\'ouverture instantanée.');
            reg.update();
          }).catch(function (err) {
            console.log('[SW] Info:', err);
          });
        });
      }
    </script>
  </head>
  <body style="margin:0;padding:0;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#f8fafc;" class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-200">
    <div id="root">
      <!-- Splash screen ultra-léger instantané (<5ms) -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(180deg,#064E3B 0%,#065F46 100%);color:white;text-align:center;padding:20px;box-sizing:border-box;">
        <div style="width:56px;height:56px;background:#10B981;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);margin-bottom:16px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.3px;">Assistant IA Excel</div>
        <div style="font-size:12px;opacity:0.8;margin-top:4px;">Afrique Francophone &amp; SYSCOHADA</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
